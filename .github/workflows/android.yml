name: Android

# Builds the Trusted Web Activity app when it changes. Separate from CI so an Android problem never blocks web deploys.
# Release signing happens locally (apps/android/README.md); this only proves the project still builds.
on:
  push:
    branches: [main]
    paths: ["apps/android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build staging and production (unsigned)
        run: ./gradlew --no-daemon assembleStagingDebug bundleProductionRelease
      - name: Check the Digital Asset Links statement is valid JSON
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$aapt2" dump resources app/build/outputs/apk/staging/debug/app-staging-debug.apk \
            | grep -A1 'string/asset_statements' | tail -1 | sed -E 's/^[^"]*"//; s/"$//' | jq -e '.[0].target.site'
