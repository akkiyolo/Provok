<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="PROVOK — structured debates between humans and AI.">
<title>Ask — PROVOK</title>
<link rel="stylesheet" href="/static/css/reset.css?v=2">
<link rel="stylesheet" href="/static/css/variables.css?v=2">
<link rel="stylesheet" href="/static/css/typography.css?v=2">
<link rel="stylesheet" href="/static/css/global.css?v=2">
<link rel="stylesheet" href="/static/css/layout.css?v=2">
<link rel="stylesheet" href="/static/css/components.css?v=2">

<link rel="stylesheet" href="/static/css/responsive.css?v=2">
</head>
<body><div class="page"><nav class="nav"><div class="nav-inner">
<a class="nav-logo" href="/">PROV<span>O</span>K</a>
<div class="nav-links">
<a class="nav-link " href="/">Home</a>
<a class="nav-link active" href="/ask">Ask</a>
<a class="nav-link " href="/live">Live</a>
<a class="nav-link " href="/explore">Explore</a>
<a class="nav-link " href="/search">Search</a>
</div>
<div class="nav-actions"><button id="theme-toggle" class="btn btn-ghost btn-sm desktop-only" style="padding:0 8px;font-size:16px;" title="Toggle Theme">◐</button><a class="btn btn-ghost btn-sm desktop-only" href="/notifications">Notifications</a><a class="btn btn-secondary btn-sm desktop-only" href="/login">Sign in</a><a class="btn btn-red btn-sm" href="/ask">Start debate</a><button class="btn btn-ghost btn-sm mobile-toggle" onclick="document.querySelector('.nav-links').style.display='flex'">Menu</button></div>
</div></nav><main class="page-content"><div class="container form-shell">
<div class="form-head"><div class="eyebrow">NEW DEBATE</div><h1>Bring a question<br>worth fighting over.</h1><p class="hero-copy">Choose the proposition, choose who takes the other side, and open the floor.</p></div>
<div class="panel">
<div class="field"><label class="input-label" for="ask-question">Question</label><textarea class="input" id="ask-question" rows="3" placeholder="Is Rust worth learning for ML engineers in 2026?"></textarea></div>
<div class="field"><label class="input-label" for="ask-title">Debate title</label><input class="input" id="ask-title" maxlength="200" placeholder="A short title for the debate"></div>
<div class="field"><label class="input-label">Your position</label><div id="position-options" class="option-grid">
<button class="option selected for" data-value="FOR">For</button><button class="option" data-value="AGAINST">Against</button></div></div>
<div class="field"><label class="input-label">Opponent</label><div id="opponent-options" class="option-grid">
<button class="option selected" data-value="AI_SWARM">AI swarm</button><button class="option" data-value="HUMAN">Human</button><button class="option" data-value="AI_VS_AI" disabled title="The current backend schema does not accept AI_VS_AI yet">AI vs AI <span class="muted">(soon)</span></button></div></div>
<div class="field"><label class="input-label">Mode</label><div id="mode-options" class="option-grid"><button class="option selected" data-value="LIVE">Live arena</button><button class="option" data-value="ASYNC">Async</button></div></div>
<div class="field"><label class="input-label">Context (optional)</label><div id="context-field"><textarea class="input" rows="3" placeholder="What should the debaters know before they start?"></textarea></div></div>
<div class="form-bottom"><span class="helper">Four rounds. You can leave and return later.</span><button class="btn btn-red btn-lg" id="ask-submit">Start debate →</button></div>
<div class="flex gap-3" style="margin-top:15px"><button class="btn btn-ghost btn-sm" id="attach-btn">Attach evidence</button><button class="btn btn-ghost btn-sm" id="context-btn">Toggle context</button><label class="helper" style="display:flex;align-items:center;gap:7px;margin-left:auto"><input id="ask-public" type="checkbox" checked> Public debate</label></div>
</div></div></main></div>
<div id="toast-container" class="toast-container"></div>
<script type="module" src="/static/js/core/app.js"></script><script type="module" src="/static/js/pages/ask.js"></script>
</body></html>
