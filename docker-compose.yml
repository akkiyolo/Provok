# Local full stack:  docker compose up --build
# Web: http://localhost:3000   API: http://localhost:8000/api/v1/docs
name: provok

x-backend: &backend
  build: { context: ., dockerfile: backend/Dockerfile }
  env_file: [.env]
  environment:
    APP_ENV: development
    DATABASE_URL: postgresql://provok:provok@postgres:5432/provok
    REDIS_URL: redis://redis:6379/0
    WEB_URL: http://localhost:3000
    API_URL: http://localhost:8000
    CORS_ORIGINS: http://localhost:3000
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: provok, POSTGRES_PASSWORD: provok, POSTGRES_DB: provok }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U provok"], interval: 5s, timeout: 3s, retries: 20 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }

  migrate:
    <<: *backend
    command: ["python", "-m", "backend.app.cli", "migrate"]
    restart: "no"

  api:
    <<: *backend
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *backend
    command: ["arq", "backend.app.workers.main.WorkerSettings"]
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: apps/web
      args: { NEXT_PUBLIC_SITE_URL: http://localhost:3000, NEXT_PUBLIC_WS_URL: "ws://localhost:8000", API_INTERNAL_URL: "http://api:8000" }
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
