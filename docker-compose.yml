version: "3.9"

services:
  # ── FastAPI application ──────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    depends_on:
      - redis
    restart: unless-stopped

  # ── Celery worker ───────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A backend.app.workers.celery_app:celery_app worker --loglevel=info -Q default,ai,verdict,embedding
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on:
      - redis
    restart: unless-stopped

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
