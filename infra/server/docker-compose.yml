# Production-style stack on one server. Images come from ECR (API_IMAGE / WEB_IMAGE set by deploy.sh);
# everything else is read from /opt/provok/.env, which deploy.sh writes from SSM.
# COMPOSE_PROFILES=localdb runs Postgres on the box (staging); production points DATABASE_URL at RDS instead.
name: provok

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  caddy:
    image: caddy:2.11.4-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # Search engines are kept out unless an environment opts in (production sets ROBOTS_TAG=all).
      ROBOTS_TAG: ${ROBOTS_TAG:-noindex, nofollow}
      REDIRECT_DOMAINS: ${REDIRECT_DOMAINS:-http://redirect.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    restart: unless-stopped
    logging: *logging

  web:
    image: ${WEB_IMAGE:?}
    environment:
      API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    logging: *logging

  api:
    image: ${API_IMAGE:?}
    env_file:
      - path: .env
        format: raw # values are used literally ($ in secrets is not interpolated)
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy, required: false }
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis_data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
    restart: unless-stopped
    logging: *logging

  postgres:
    profiles: [localdb]
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: provok
      POSTGRES_DB: provok
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env when using the localdb profile}
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U provok"], interval: 5s, timeout: 3s, retries: 20 }
    restart: unless-stopped
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  pg_data:
