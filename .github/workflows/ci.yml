name: CI
on:
  push:
  pull_request:

concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: provok, POSTGRES_PASSWORD: provok, POSTGRES_DB: provok_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U provok" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://provok:provok@localhost:5432/provok_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint
        run: ruff check backend
      - name: Migrations apply cleanly and match models
        env: { DATABASE_URL: "postgresql://provok:provok@localhost:5432/provok_test", APP_ENV: test }
        run: |
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini check
          alembic -c backend/alembic.ini downgrade base
      - name: Tests
        run: pytest --cov=backend/app --cov-report=term-missing:skip-covered -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env: { API_INTERNAL_URL: "http://localhost:8000", NEXT_PUBLIC_SITE_URL: "https://provok.app" }

  docker:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t provok-api .

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: provok, POSTGRES_PASSWORD: provok, POSTGRES_DB: provok }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U provok" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      APP_ENV: development
      DATABASE_URL: postgresql://provok:provok@localhost:5432/provok
      REDIS_URL: redis://localhost:6379/0
      WEB_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      JWT_SECRET_KEY: ci-e2e-secret-key-not-for-production-1234567890
      LLM_FAKE: "true"
      REQUIRE_VERIFIED_EMAIL_TO_DEBATE: "false"
      RL_SIGNUP_IP: 1000/3600
      RL_GENERAL_IP: 100000/60
      RL_LOGIN_IP: 1000/60
      FEATURED_AVA_HOURS_UTC: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: pip install -r backend/requirements.txt
      - run: python -m backend.app.cli migrate
      - name: Start API + worker
        run: |
          nohup uvicorn backend.app.main:app --port 8000 > api.log 2>&1 &
          nohup arq backend.app.workers.main.WorkerSettings > worker.log 2>&1 &
      - name: Build & start web
        working-directory: apps/web
        env: { API_INTERNAL_URL: "http://localhost:8000", NEXT_PUBLIC_SITE_URL: "http://localhost:3000" }
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npm start > web.log 2>&1 &
          npx wait-on -t 60000 http-get://localhost:3000 http-get://localhost:8000/health
      - name: Playwright
        working-directory: apps/web
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: "apps/web/playwright-report\napi.log\nworker.log" }
