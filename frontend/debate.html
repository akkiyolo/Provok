<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="PROVOK — structured debates between humans and AI.">
<title>Debate — PROVOK</title>
<link rel="stylesheet" href="/static/css/reset.css?v=2">
<link rel="stylesheet" href="/static/css/variables.css?v=2">
<link rel="stylesheet" href="/static/css/typography.css?v=2">
<link rel="stylesheet" href="/static/css/global.css?v=2">
<link rel="stylesheet" href="/static/css/layout.css?v=2">
<link rel="stylesheet" href="/static/css/components.css?v=2">
<link rel="stylesheet" href="/static/css/debate.css?v=2">
<link rel="stylesheet" href="/static/css/responsive.css?v=2">
</head>
<body><div class="page"><main class="debate-page">
<header class="debate-top"><div class="debate-topline"><div>
  <div class="eyebrow" style="color:#77736b">PROVOK / LIVE ARENA</div>
  <div class="debate-question" id="debate-question">Loading debate…</div>
</div><div class="debate-topmeta">
  <span class="badge badge-live" id="debate-status-badge">LIVE</span>
  <span class="watchers" id="debate-watchers">—</span>
  <a class="dark-btn" href="/">Leave</a>
</div></div>
<div class="rounds" id="rounds-track"></div>
<div class="round-label" id="round-label">Loading…</div>
</header>
<div class="debate-shell"><section class="debate-main"><div class="stream" id="argument-stream">
  <div class="loading-state" id="loading-state" style="color:var(--muted);padding:40px 28px;font-size:14px">Loading debate…</div>
</div>
<div class="compose" style="display: none;"><div class="compose-inner"><textarea class="compose-input" id="compose-input" rows="1" placeholder="Write your argument…"></textarea><button class="btn btn-red" id="btn-submit-argument">Submit</button></div><div class="compose-actions"><button class="dark-btn" id="btn-finish-turn">Done with turn</button><button class="dark-btn" id="btn-concede" style="color:#db6557">Concede</button><span style="margin-left:auto;color:#6e6a62;font-size:10px">Ctrl / ⌘ + Enter to send</span></div></div>
</section>
<aside class="debate-side">
<div class="side-section"><div class="side-title">Participants</div><div id="participants-list"></div></div>
<div class="side-section"><div class="vote-box"><div class="side-title">ROUND VOTE</div><h3>Who won this round?</h3><div class="vote-buttons" id="vote-buttons"></div></div></div>
<div class="side-section"><div class="side-title">Audience challenges</div><div id="audience-challenges"></div><button class="dark-btn" id="btn-submit-challenge" style="width:100%;margin-top:8px">Challenge the room</button></div>
<div><div class="side-title">Your control</div><button class="dark-btn" id="btn-take-break" style="width:100%">Save my place &amp; leave</button></div>
</aside></div></main></div><div id="toast-container" class="toast-container"></div>
<script type="module" src="/static/js/core/app.js?v=6"></script><script type="module" src="/static/js/pages/debate.js?v=6"></script>
</body></html>
