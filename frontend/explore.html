<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore — PROVOK</title>
    <link rel="stylesheet" href="/static/css/reset.css">
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/typography.css">
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/feed.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body>
<div class="page">
    <nav class="nav"><div class="nav-inner"><a href="/" class="nav-logo">PROVOK</a><div class="nav-links"><a href="/" class="nav-link">Home</a><a href="/ask" class="nav-link">Ask</a><a href="/live" class="nav-link">Live</a><a href="/explore" class="nav-link active">Explore</a></div><div class="nav-actions"><a href="/login" class="btn btn-secondary btn-sm">Sign In</a><a href="/ask" class="btn btn-primary btn-sm">Start Debate</a></div></div></nav>
    <main class="page-content">
        <section class="section" style="padding-top: var(--space-16);">
            <div class="container">
                <h1 style="font-size: var(--text-3xl); margin-bottom: var(--space-2);">Explore</h1>
                <p class="text-secondary" style="margin-bottom: var(--space-8);">Discover debates, questions, topics, and people</p>
                <div class="flex flex-wrap gap-2" style="margin-bottom: var(--space-8);" id="explore-topics">
                    <span class="tag active">All</span>
                    <span class="tag">Technology</span>
                    <span class="tag">Philosophy</span>
                    <span class="tag">Science</span>
                    <span class="tag">Gaming</span>
                    <span class="tag">Economics</span>
                    <span class="tag">Culture</span>
                    <span class="tag">AI & ML</span>
                    <span class="tag">Programming</span>
                </div>
                <div class="grid grid-2" id="explore-grid">
                    <div class="empty-state" style="grid-column: 1 / -1;" id="explore-empty">
                        <div class="empty-state-icon">🔍</div>
                        <div class="empty-state-title">Explore debates</div>
                        <p class="empty-state-text">Debates will appear here once you start exploring.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
</div>
<script type="module" src="/static/js/core/app.js"></script>
</body>
</html>
