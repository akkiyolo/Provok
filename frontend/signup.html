<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — PROVOK</title>
    <link rel="stylesheet" href="/static/css/reset.css">
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/typography.css">
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
    <style>
        .auth-page { min-height: calc(100vh - var(--nav-height)); display: flex; align-items: center; justify-content: center; padding: var(--space-8); }
        .auth-card { width: 100%; max-width: 420px; background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); padding: var(--space-8); }
        .auth-title { font-family: var(--font-display); font-size: var(--text-2xl); font-weight: var(--weight-bold); text-align: center; margin-bottom: var(--space-2); }
        .auth-subtitle { font-size: var(--text-sm); color: var(--text-tertiary); text-align: center; margin-bottom: var(--space-8); }
        .auth-form { display: flex; flex-direction: column; gap: var(--space-4); }
        .auth-divider { display: flex; align-items: center; gap: var(--space-3); margin: var(--space-4) 0; font-size: var(--text-sm); color: var(--text-muted); }
        .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border-subtle); }
        .auth-footer { text-align: center; margin-top: var(--space-6); font-size: var(--text-sm); color: var(--text-tertiary); }
        .auth-footer a { color: var(--brand-400); font-weight: var(--weight-medium); }
        .btn-google { background: white; color: #1f1f1f; border: 1px solid #dadce0; display: flex; align-items: center; justify-content: center; gap: var(--space-2); font-weight: var(--weight-medium); }
        .btn-google:hover { background: #f8f9fa; }
        .auth-error { padding: var(--space-3); background: var(--error-bg); border: 1px solid rgba(239,68,68,0.2); border-radius: var(--radius-md); color: var(--error); font-size: var(--text-sm); display: none; }
    </style>
</head>
<body>
<div class="page">
    <nav class="nav"><div class="nav-inner"><a href="/" class="nav-logo">PROVOK</a></div></nav>
    <main class="page-content">
        <div class="auth-page">
            <div class="auth-card">
                <h1 class="auth-title">Join PROVOK</h1>
                <p class="auth-subtitle">Put your beliefs to the test</p>
                <div class="auth-error" id="auth-error"></div>
                <button class="btn btn-google btn-lg" id="btn-google-signup" style="width: 100%;">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    Continue with Google
                </button>
                <div class="auth-divider">or</div>
                <form class="auth-form" id="signup-form">
                    <div class="input-group">
                        <label class="input-label" for="signup-username">Username</label>
                        <input type="text" class="input" id="signup-username" placeholder="yourname" required>
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="signup-email">Email</label>
                        <input type="email" class="input" id="signup-email" placeholder="you@example.com" required>
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="signup-password">Password</label>
                        <input type="password" class="input" id="signup-password" placeholder="At least 8 characters" required minlength="8">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Create Account</button>
                </form>
                <div class="auth-footer">Already have an account? <a href="/login">Sign in</a></div>
            </div>
        </div>
    </main>
</div>
<script type="module" src="/static/js/core/app.js"></script>
<script type="module" src="/static/js/auth/signup.js"></script>
</body>
</html>
