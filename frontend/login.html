<body><div class="page"><nav class="nav"><div class="nav-inner">
<a class="nav-logo" href="/">PROV<span>O</span>K</a>
<div class="nav-links">
<a class="nav-link " href="/">Home</a>

</div></nav><main class="page-content"><div class="auth-wrap">
<section class="auth-brand"><div class="eyebrow">THE ARGUMENT FLOOR</div><h1>Come back<br>to the fight.</h1><p>Pick up unfinished debates, watch the room move, or put another belief under pressure.</p></section>
<section class="auth-form-wrap"><div class="auth-card"><div class="eyebrow">SIGN IN</div><h2 style="margin-top:8px">Welcome back.</h2><p class="sub">Your debates are waiting.</p><div class="auth-error" id="auth-error"></div>
<button class="btn btn-google btn-lg" id="btn-google-login">Continue with Google</button><div class="auth-divider">OR</div>
<form class="auth-form" id="login-form"><div><label class="input-label" for="login-email">Email</label><input class="input" id="login-email" type="email" required autocomplete="email" placeholder="you@example.com"></div><div><label class="input-label" for="login-password">Password</label><input class="input" id="login-password" type="password" required autocomplete="current-password" placeholder="••••••••"></div><button class="btn btn-primary btn-lg" id="login-submit" type="submit">Sign in</button></form>
<div class="auth-footer">New here? <a href="/signup">Create an account</a></div></div></section></div></main></div><div id="toast-container" class="toast-container"></div>
<script type="module" src="/static/js/core/app.js"></script><script type="module" src="/static/js/auth/login.js"></script>
