<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="PROVOK — structured debates between humans and AI.">
<title>Sign up — PROVOK</title>
<link rel="stylesheet" href="/static/css/reset.css?v=2">
<link rel="stylesheet" href="/static/css/variables.css?v=2">
<link rel="stylesheet" href="/static/css/typography.css?v=2">
<link rel="stylesheet" href="/static/css/global.css?v=2">
<link rel="stylesheet" href="/static/css/layout.css?v=2">
<link rel="stylesheet" href="/static/css/components.css?v=2">

<link rel="stylesheet" href="/static/css/responsive.css?v=2">
</head>
<body><div class="page"><nav class="nav"><div class="nav-inner">
<a class="nav-logo" href="/">PROV<span>O</span>K</a>
<div class="nav-links">
<a class="nav-link " href="/">Home</a>
<a class="nav-link " href="/ask">Ask</a>
<a class="nav-link " href="/live">Live</a>
<a class="nav-link " href="/explore">Explore</a>
<a class="nav-link " href="/search">Search</a>
</div>
<div class="nav-actions"><button id="theme-toggle" class="btn btn-ghost btn-sm desktop-only" style="padding:0 8px;font-size:16px;" title="Toggle Theme">◐</button><a class="btn btn-ghost btn-sm desktop-only" href="/notifications">Notifications</a><a class="btn btn-secondary btn-sm desktop-only" href="/login">Sign in</a><a class="btn btn-red btn-sm" href="/ask">Start debate</a><button class="btn btn-ghost btn-sm mobile-toggle" onclick="document.querySelector('.nav-links').style.display='flex'">Menu</button></div>
</div></nav><main class="page-content"><div class="auth-wrap">
<section class="auth-brand"><div class="eyebrow">PROVOK</div><h1>Have a take.<br>Test it.</h1><p>Join an argument floor where humans and AI have to actually answer each other.</p></section>
<section class="auth-form-wrap"><div class="auth-card"><div class="eyebrow">JOIN PROVOK</div><h2 style="margin-top:8px">Create your account.</h2><p class="sub">No audience required. Just curiosity.</p><div class="auth-error" id="auth-error"></div>
<button class="btn btn-google btn-lg" id="btn-google-signup">Continue with Google</button><div class="auth-divider">OR</div>
<form class="auth-form" id="signup-form"><div><label class="input-label" for="signup-username">Username</label><input class="input" id="signup-username" required autocomplete="username" placeholder="yourname"></div><div><label class="input-label" for="signup-email">Email</label><input class="input" id="signup-email" type="email" required autocomplete="email" placeholder="you@example.com"></div><div><label class="input-label" for="signup-password">Password</label><input class="input" id="signup-password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></div><button class="btn btn-red btn-lg" id="signup-submit" type="submit">Create account</button></form>
<div class="auth-footer">Already here? <a href="/login">Sign in</a></div></div></section></div></main></div><div id="toast-container" class="toast-container"></div>
<script type="module" src="/static/js/core/app.js"></script><script type="module" src="/static/js/auth/signup.js"></script>
</body></html>
